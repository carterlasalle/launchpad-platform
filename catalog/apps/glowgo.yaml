apiVersion: launchpad.dev/v1
kind: Application
metadata:
  id: glowgo
  displayName: GlowGo
  description: Mobile spray tan marketplace — find, book, and review vetted mobile artists
  owners:
    - "@CarterLaSalle"
  labels:
    team: marketplace
    criticality: low
  annotations: {}
repository:
  provider: github
  name: carterlasalle/glowgo
  productionBranch: main
  deploymentRef: main
  access:
    requirePrivateAccessVerification: false
    requireVercelGitAccess: true
  onboarding:
    managedWorkflow: true
    workflowVersion: v1
    openOnboardingPr: false
vercel:
  scope: {}
  project:
    name: glowgo
    framework: nextjs
    rootDirectory: .
    nodeVersion: "24.x"
    build:
      installCommand: npm install
      buildCommand: npm run build:web
      outputDirectory: apps/web/.next
      developmentCommand: null
      ignoredBuildStep: null
    git:
      connected: true
      productionBranch: main
    deployment:
      autoAssignProductionDomains: false
    regions:
      functions: []
    protection: {}
    settings: {}
environments:
  preview:
    enabled: true
    strategy: shadow-project
    source:
      ref: main
    cleanup:
      onPrClose: true
      retentionHours: 24
    health:
      path: /api/health
      method: GET
      expectedStatus: [200]
      timeoutSeconds: 10
      attempts: 3
      intervalSeconds: 1
  production:
    enabled: true
    health:
      path: /api/health
      method: GET
      expectedStatus: [200]
      timeoutSeconds: 10
      attempts: 3
      intervalSeconds: 1
    release:
      strategy: staged-production
      promoteExactBuild: true
      autoPromoteAfterChecks: true
    rollback:
      enabled: true
      onFailedHealthCheck: true
      previousKnownGood: true
domains:
  - hostname: glowgo.carterlasalle.com
    environment: production
    canonical: true
    cloudflare:
      zoneRef: config://cloudflare/carterlasalle.com
      mode: dns-only
      ttl: auto
    redirects: []
secrets:
  - name: NEXT_PUBLIC_CONVEX_URL
    source: env://NEXT_PUBLIC_CONVEX_URL
    sensitive: true
    environments: [production]
dependencies:
  applications: []
  external: []
policies:
  drift:
    mode: open-pr
    checkIntervalMinutes: 30
  destructiveChanges:
    allowInNormalApply: false
  preview:
    requiredForMerge: true
  staging:
    requiredForProduction: false
  health:
    requiredForPromotion: true
  failures:
    createIssueAfterFinalRetry: true
    notifyOwners: true
lifecycle:
  state: active
  deletionProtection: true
  orphanPolicy: retain
