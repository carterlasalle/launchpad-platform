apiVersion: launchpad.dev/v1
kind: Application
metadata:
  id: tanscore
  displayName: TanScore
  description: Solar/UV forecast and tanning opportunity dashboard (SunStack static export)
  owners:
    - "@CarterLaSalle"
  labels:
    team: platform
    criticality: low
  annotations: {}
repository:
  provider: github
  name: carterlasalle/openmeteo-sunstack-tanscore
  productionBranch: main
  deploymentRef: main
  access:
    requirePrivateAccessVerification: false
    requireVercelGitAccess: true
  onboarding:
    managedWorkflow: true
    workflowVersion: v1
    openOnboardingPr: false
vercel:
  scope: {}
  project:
    name: tanscore
    framework: null
    rootDirectory: docs
    nodeVersion: "24.x"
    build:
      installCommand: "echo static-export"
      buildCommand: "echo static-export"
      outputDirectory: .
      developmentCommand: null
      ignoredBuildStep: null
    git:
      connected: true
      productionBranch: main
    deployment:
      autoAssignProductionDomains: false
    regions:
      functions: []
    protection: {}
    settings: {}
environments:
  preview:
    enabled: true
    strategy: shadow-project
    source:
      ref: main
    cleanup:
      onPrClose: true
      retentionHours: 24
    health:
      path: /
      method: GET
      expectedStatus: [200]
      timeoutSeconds: 10
      attempts: 3
      intervalSeconds: 1
  production:
    enabled: true
    health:
      path: /
      method: GET
      expectedStatus: [200]
      timeoutSeconds: 10
      attempts: 3
      intervalSeconds: 1
    release:
      strategy: staged-production
      promoteExactBuild: true
      autoPromoteAfterChecks: true
    rollback:
      enabled: true
      onFailedHealthCheck: true
      previousKnownGood: true
domains:
  - hostname: tanscore.carterlasalle.com
    environment: production
    canonical: true
    cloudflare:
      zoneRef: config://cloudflare/carterlasalle.com
      mode: dns-only
      ttl: auto
    redirects: []
secrets: []
dependencies:
  applications: []
  external: []
policies:
  drift:
    mode: open-pr
    checkIntervalMinutes: 30
  destructiveChanges:
    allowInNormalApply: false
  preview:
    requiredForMerge: true
  staging:
    requiredForProduction: false
  health:
    requiredForPromotion: true
  failures:
    createIssueAfterFinalRetry: true
    notifyOwners: true
lifecycle:
  state: active
  deletionProtection: true
  orphanPolicy: retain
  decommission:
    requestedAt: null
    deleteAfter: null
    approvalToken: null
    preserveDeployments: true
