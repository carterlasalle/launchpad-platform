<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111315" />
    <title>Launchpad Control Plane</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">↗</span>
          <a class="brand-name" href="#/" aria-label="Launchpad control plane">LAUNCHPAD<small>CONTROL PLANE</small></a>
        </div>
        <nav class="nav" aria-label="Dashboard sections">
          <a href="#/" data-nav="applications">APPLICATIONS</a>
          <a href="#/operations" data-nav="operations">OPERATIONS</a>
          <a href="#/audit" data-nav="audit">AUDIT</a>
          <a href="#/credentials" data-nav="credentials">CREDENTIALS</a>
        </nav>
        <div class="topbar-meta">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span id="auth-state">NO SESSION</span>
          <button id="session-toggle" type="button" class="button button--ghost button--compact">SESSION</button>
        </div>
      </header>
      <section id="session-panel" class="session-panel" aria-label="Operator session">
        <p class="eyebrow">OPERATOR SESSION</p>
        <label for="session-token">Bearer token</label>
        <input id="session-token" type="password" autocomplete="off" spellcheck="false" />
        <p id="session-hint" class="session-panel__hint"></p>
        <div class="session-panel__actions">
          <button id="session-save" type="button" class="button">SAVE SESSION</button>
          <button id="session-clear" type="button" class="button button--ghost">CLEAR SESSION</button>
        </div>
      </section>
      <main class="content" id="view"></main>
      <footer class="footer">
        <span>LAUNCHPAD 1.0</span>
        <span>GIT IS THE DESIRED STATE</span>
        <span>SAFE BY DEFAULT</span>
        <span id="current-time"></span>
      </footer>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
