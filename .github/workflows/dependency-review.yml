name: Launchpad Dependency Review

on:
  pull_request: {}

permissions: {}

jobs:
  dependency-review:
    name: dependency / review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect dependency changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- package.json yarn.lock ':(glob)**/package.json'; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.scope.outputs.relevant == 'true'
        with:
          node-version-file: .node-version
      - name: Enable Corepack without installing pull-request dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: corepack enable
      - name: Audit dependency graph
        if: steps.scope.outputs.relevant == 'true'
        run: yarn npm audit --all --recursive --severity high
