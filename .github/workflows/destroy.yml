name: Launchpad Destroy

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application ID
        required: true
        type: string
      approval_token:
        description: Single-use deletion approval token
        required: true
        type: string

permissions: {}

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: launchpad-destruction
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '24.18.0', cache: yarn }
      - uses: ./.github/actions/setup-launchpad
      - run: yarn platform destroy --catalog catalog --app '${{ inputs.application }}' --approval-token '${{ inputs.approval_token }}'
        env:
          LAUNCHPAD_CONTROLLER_URL: ${{ vars.LAUNCHPAD_CONTROLLER_URL }}
          LAUNCHPAD_OPERATOR_TOKEN: ${{ secrets.LAUNCHPAD_OPERATOR_TOKEN }}
