name: Launchpad Destroy

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application ID
        required: true
        type: string
      approval_token:
        description: Single-use deletion approval token
        required: true
        type: string

permissions: {}

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: launchpad-destruction
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24.18.0' }
      - uses: ./.github/actions/setup-launchpad
      - run: yarn platform destroy --catalog catalog --app '${{ inputs.application }}' --approval-token '${{ inputs.approval_token }}'
        env:
          LAUNCHPAD_CONTROLLER_URL: ${{ vars.LAUNCHPAD_CONTROLLER_SMOKE_URL }}
          LAUNCHPAD_OPERATOR_TOKEN: ${{ secrets.LAUNCHPAD_OPERATOR_TOKEN }}
