name: Launchpad Apply

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'schema/**'
      - 'packages/**'
      - 'workflows/**'
      - '.github/workflows/apply.yml'

permissions: {}

concurrency:
  group: launchpad-production-apply
  cancel-in-progress: false

jobs:
  control-plane-mode:
    name: control plane / mode
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enabled: ${{ steps.mode.outputs.enabled }}
    steps:
      - name: Resolve control-plane mode
        id: mode
        shell: bash
        env:
          ENABLED: ${{ vars.LAUNCHPAD_CONTROL_PLANE_ENABLED }}
        run: |
          set -euo pipefail
          case "$ENABLED" in
            true)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Launchpad control plane is enabled."
              ;;
            false|'')
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Launchpad control plane is disabled. Follow docs/guides/deployment.md before setting LAUNCHPAD_CONTROL_PLANE_ENABLED=true."
              ;;
            *)
              echo "::error::LP-CONTROL-PLANE-MODE-INVALID: LAUNCHPAD_CONTROL_PLANE_ENABLED must be exactly true or false."
              exit 1
              ;;
          esac

  apply:
    needs: control-plane-mode
    if: needs.control-plane-mode.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: launchpad-production
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: { node-version: '24.18.0' }
      - uses: ./.github/actions/setup-launchpad
      - name: Revalidate and apply
        env:
          LAUNCHPAD_OIDC_AUDIENCE: ${{ vars.LAUNCHPAD_OIDC_AUDIENCE }}
          LAUNCHPAD_CONTROLLER_URL: ${{ vars.LAUNCHPAD_CONTROLLER_SMOKE_URL }}
          LAUNCHPAD_GITHUB_TOKEN: ${{ secrets.LAUNCHPAD_GITHUB_TOKEN }}
          LAUNCHPAD_VERCEL_TOKEN: ${{ secrets.LAUNCHPAD_VERCEL_TOKEN }}
          LAUNCHPAD_VERCEL_TEAM_ID: ${{ vars.LAUNCHPAD_VERCEL_TEAM_ID }}
          LAUNCHPAD_CLOUDFLARE_TOKEN: ${{ secrets.LAUNCHPAD_CLOUDFLARE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -euo pipefail
          yarn platform validate --catalog catalog
          # The controller reloads the merged manifest at $GITHUB_SHA and
          # recomputes the plan itself; the CLI rebuilds the approved plan
          # from live provider state so the fingerprint and idempotency key
          # match before the OIDC-authenticated apply enqueues the durable
          # workflow. PR plan artifacts are not reachable from push runs, so
          # read-only provider tokens are required.
          yarn platform apply --catalog catalog --sha "$GITHUB_SHA" --controller "$LAUNCHPAD_CONTROLLER_URL"
