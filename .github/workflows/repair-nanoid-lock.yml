name: Repair nanoid lock resolution

on:
  push:
    branches:
      - fix/nanoid-audit-20260818

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/nanoid-audit-20260818
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Refresh vulnerable transitive resolution with Yarn
        run: |
          set -euo pipefail
          corepack enable
          corepack yarn@4.10.3 up -R nanoid@3.3.18
          corepack yarn@4.10.3 npm audit --all --recursive --severity high
      - name: Commit regenerated lockfile and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/repair-nanoid-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yarn.lock .github/workflows/repair-nanoid-lock.yml
          git commit -m 'fix(deps): refresh nanoid to 3.3.18'
          git push origin HEAD:fix/nanoid-audit-20260818
