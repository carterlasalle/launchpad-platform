name: Launchpad Plan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: launchpad-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.0'
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  changes:
    name: platform / scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify PR head SHA is still current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ env.HEAD_SHA }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to run: expected head SHA is not a 40-character hex commit."
            exit 1
          fi
          actual="$(gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST}" --jq '.head.sha')"
          if [[ "${actual:-}" != "$EXPECTED_SHA" ]]; then
            echo "::error::Superseded run: the PR head is '${actual:-unknown}', expected '$EXPECTED_SHA'."
            exit 1
          fi
      - name: Detect catalog-impacting changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            catalog schema apps/cli apps/controller packages workflows migrations/d1 \
            wrangler.jsonc .github/actions .github/workflows/validate-plan.yml \
            .github/workflows/reusable-app-preview.yml; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No catalog-impacting files changed; provider plan and preview jobs will be skipped."
          else
            status=$?
            if [[ "$status" -ne 1 ]]; then
              echo "::error::Unable to determine the pull-request change scope."
              exit "$status"
            fi
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  schema:
    name: platform / schema
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify PR head SHA is still current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ env.HEAD_SHA }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to run: expected head SHA is not a 40-character hex commit."
            exit 1
          fi
          actual="$(gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST}" --jq '.head.sha')"
          if [[ "${actual:-}" != "$EXPECTED_SHA" ]]; then
            echo "::error::Superseded run: the PR head is '${actual:-unknown}', expected '$EXPECTED_SHA'."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/setup-launchpad
      - run: yarn typecheck
      - run: yarn platform validate --catalog catalog

  catalog:
    name: platform / catalog
    needs: [changes, schema]
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify PR head SHA is still current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ env.HEAD_SHA }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to run: expected head SHA is not a 40-character hex commit."
            exit 1
          fi
          actual="$(gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST}" --jq '.head.sha')"
          if [[ "${actual:-}" != "$EXPECTED_SHA" ]]; then
            echo "::error::Superseded run: the PR head is '${actual:-unknown}', expected '$EXPECTED_SHA'."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/setup-launchpad
      - run: yarn test

  provider-preflight:
    name: platform / provider-preflight
    needs: [changes, catalog]
    if: ${{ needs.changes.outputs.relevant == 'true' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted platform implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted
      - name: Checkout proposed catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: proposed
          sparse-checkout: catalog
      - uses: ./trusted/.github/actions/assert-pr-head
        with:
          repository: ${{ github.repository }}
          pull_number: ${{ github.event.pull_request.number }}
          expected_sha: ${{ env.HEAD_SHA }}
          token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install trusted platform dependencies
        working-directory: trusted
        run: |
          corepack enable
          YARN_ENABLE_GLOBAL_CACHE=0 corepack yarn@4.10.3 install --immutable
      - name: Run provider preflight
        working-directory: trusted
        run: yarn platform preflight --catalog "$GITHUB_WORKSPACE/proposed/catalog" --format json
        env:
          LAUNCHPAD_GITHUB_TOKEN: ${{ secrets.LAUNCHPAD_GITHUB_TOKEN }}
          LAUNCHPAD_VERCEL_TOKEN: ${{ secrets.LAUNCHPAD_VERCEL_TOKEN }}
          LAUNCHPAD_VERCEL_TEAM_ID: ${{ vars.LAUNCHPAD_VERCEL_TEAM_ID }}
          LAUNCHPAD_CLOUDFLARE_TOKEN: ${{ secrets.LAUNCHPAD_CLOUDFLARE_TOKEN }}

  plan:
    name: platform / plan
    needs: [changes, catalog, provider-preflight]
    if: ${{ needs.changes.outputs.relevant == 'true' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted platform implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted
      - name: Checkout proposed catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: proposed
          sparse-checkout: catalog
      - uses: ./trusted/.github/actions/assert-pr-head
        with:
          repository: ${{ github.repository }}
          pull_number: ${{ github.event.pull_request.number }}
          expected_sha: ${{ env.HEAD_SHA }}
          token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install trusted platform dependencies
        working-directory: trusted
        run: |
          corepack enable
          YARN_ENABLE_GLOBAL_CACHE=0 corepack yarn@4.10.3 install --immutable
      - name: Build provider-aware plan
        working-directory: trusted
        run: yarn platform plan --catalog "$GITHUB_WORKSPACE/proposed/catalog" --sha ${{ env.HEAD_SHA }} --format json --output "$GITHUB_WORKSPACE/artifacts"
        env:
          LAUNCHPAD_GITHUB_TOKEN: ${{ secrets.LAUNCHPAD_GITHUB_TOKEN }}
          LAUNCHPAD_VERCEL_TOKEN: ${{ secrets.LAUNCHPAD_VERCEL_TOKEN }}
          LAUNCHPAD_VERCEL_TEAM_ID: ${{ vars.LAUNCHPAD_VERCEL_TEAM_ID }}
          LAUNCHPAD_CLOUDFLARE_TOKEN: ${{ secrets.LAUNCHPAD_CLOUDFLARE_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: launchpad-plan
          path: artifacts
          retention-days: 7
          if-no-files-found: warn

  preview:
    name: platform / preview
    needs: [changes, plan, provider-preflight]
    if: ${{ needs.changes.outputs.relevant == 'true' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      LAUNCHPAD_CONTROLLER_URL: ${{ vars.LAUNCHPAD_CONTROLLER_SMOKE_URL }}
      LAUNCHPAD_OIDC_AUDIENCE: ${{ vars.LAUNCHPAD_OIDC_AUDIENCE }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
    steps:
      - name: Checkout trusted platform implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted
      - name: Checkout proposed catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: proposed
          sparse-checkout: catalog
      - uses: ./trusted/.github/actions/assert-pr-head
        with:
          repository: ${{ github.repository }}
          pull_number: ${{ github.event.pull_request.number }}
          expected_sha: ${{ env.HEAD_SHA }}
          token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install trusted platform dependencies
        working-directory: trusted
        run: |
          corepack enable
          YARN_ENABLE_GLOBAL_CACHE=0 corepack yarn@4.10.3 install --immutable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: launchpad-plan
          path: artifacts
      - name: Request isolated preview
        working-directory: trusted
        run: yarn platform preview --catalog "$GITHUB_WORKSPACE/proposed/catalog" --sha ${{ env.HEAD_SHA }} --pr ${{ github.event.pull_request.number }} --controller "$LAUNCHPAD_CONTROLLER_URL" --plans "$GITHUB_WORKSPACE/artifacts/plans.json" --output "$GITHUB_WORKSPACE/preview-artifacts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: launchpad-preview
          path: preview-artifacts
          retention-days: 7
          if-no-files-found: warn

  health:
    name: platform / health
    needs: [changes, preview]
    if: ${{ needs.changes.outputs.relevant == 'true' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted platform implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted
      - name: Checkout proposed catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: proposed
          sparse-checkout: catalog
      - uses: ./trusted/.github/actions/assert-pr-head
        with:
          repository: ${{ github.repository }}
          pull_number: ${{ github.event.pull_request.number }}
          expected_sha: ${{ env.HEAD_SHA }}
          token: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install trusted platform dependencies
        working-directory: trusted
        run: |
          corepack enable
          YARN_ENABLE_GLOBAL_CACHE=0 corepack yarn@4.10.3 install --immutable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: launchpad-preview
          path: preview-artifacts
      - name: Verify preview health
        working-directory: trusted
        run: yarn platform health --catalog "$GITHUB_WORKSPACE/proposed/catalog" --sha ${{ env.HEAD_SHA }} --preview-summary "$GITHUB_WORKSPACE/preview-artifacts/preview-summary.json" --output "$GITHUB_WORKSPACE/health-artifacts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: launchpad-health
          path: health-artifacts
          retention-days: 7
          if-no-files-found: warn

  summary:
    name: platform / summary
    needs: [changes, schema, catalog, provider-preflight, plan, preview, health]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted platform implementation
        if: ${{ needs.changes.outputs.relevant == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted
      - name: Checkout proposed catalog
        if: ${{ needs.changes.outputs.relevant == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: proposed
          sparse-checkout: catalog
      - uses: ./trusted/.github/actions/assert-pr-head
        if: ${{ needs.changes.outputs.relevant == 'true' }}
        with:
          repository: ${{ github.repository }}
          pull_number: ${{ github.event.pull_request.number }}
          expected_sha: ${{ env.HEAD_SHA }}
          token: ${{ github.token }}
      - name: Aggregate required job results
        shell: bash
        run: |
          set -euo pipefail
          changes_result='${{ needs.changes.result }}'
          relevant='${{ needs.changes.outputs.relevant }}'
          failed=0
          if [[ "$changes_result" != "success" ]]; then
            echo "::error::Change classification ended with '${changes_result}'; the Launchpad PR gate is red."
            failed=1
          elif [[ "$relevant" == "true" ]]; then
            for entry in \
              "schema=${{ needs.schema.result }}" \
              "catalog=${{ needs.catalog.result }}" \
              "provider-preflight=${{ needs.provider-preflight.result }}" \
              "plan=${{ needs.plan.result }}" \
              "preview=${{ needs.preview.result }}" \
              "health=${{ needs.health.result }}"; do
              name="${entry%%=*}"
              result="${entry#*=}"
              if [[ "$result" != "success" ]]; then
                echo "::error::Required job '${name}' ended with '${result}'; the Launchpad PR gate is red."
                failed=1
              fi
            done
          elif [[ "$relevant" == "false" ]]; then
            echo "::notice::No catalog-impacting files changed; internal plan jobs were intentionally skipped."
          else
            echo "::error::Change classification produced invalid relevance '${relevant}'."
            failed=1
          fi
          echo "LAUNCHPAD_REQUIRED_FAILED=$failed" >> "$GITHUB_ENV"
      - name: Record required job results for the report comment
        if: ${{ needs.changes.outputs.relevant == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          cat > report/job-results.json <<EOF
          {
            "schemaVersion": "launchpad.job-results/v1",
            "sourceCommit": "${{ env.HEAD_SHA }}",
            "jobs": [
              {"name": "schema", "result": "${{ needs.schema.result }}"},
              {"name": "catalog", "result": "${{ needs.catalog.result }}"},
              {"name": "provider-preflight", "result": "${{ needs.provider-preflight.result }}"},
              {"name": "plan", "result": "${{ needs.plan.result }}"},
              {"name": "preview", "result": "${{ needs.preview.result }}"},
              {"name": "health", "result": "${{ needs.health.result }}"}
            ]
          }
          EOF
          test -s report/job-results.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ needs.changes.outputs.relevant == 'true' }}
        continue-on-error: true
        with:
          name: launchpad-plan
          path: report/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ needs.changes.outputs.relevant == 'true' }}
        continue-on-error: true
        with:
          name: launchpad-preview
          path: report/preview
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ needs.changes.outputs.relevant == 'true' }}
        continue-on-error: true
        with:
          name: launchpad-health
          path: report/health
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: ${{ needs.changes.outputs.relevant == 'true' && !github.event.pull_request.head.repo.fork }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install trusted platform dependencies
        if: ${{ needs.changes.outputs.relevant == 'true' && !github.event.pull_request.head.repo.fork }}
        working-directory: trusted
        run: |
          corepack enable
          YARN_ENABLE_GLOBAL_CACHE=0 corepack yarn@4.10.3 install --immutable
      - name: Publish aggregated Launchpad report comment
        if: ${{ needs.changes.outputs.relevant == 'true' && !github.event.pull_request.head.repo.fork }}
        working-directory: trusted
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: yarn platform report-pr --catalog "$GITHUB_WORKSPACE/proposed/catalog" --sha ${{ env.HEAD_SHA }} --pr ${{ github.event.pull_request.number }} --artifacts "$GITHUB_WORKSPACE/report" --output "$GITHUB_WORKSPACE/report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && needs.changes.outputs.relevant == 'true' }}
        continue-on-error: true
        with:
          name: launchpad-report
          path: report
          retention-days: 7
          if-no-files-found: warn
      - name: Fail summary when any required job failed or was cancelled
        if: ${{ always() && env.LAUNCHPAD_REQUIRED_FAILED == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::One or more required Launchpad jobs failed or were cancelled; the PR gate is red."
          exit 1
