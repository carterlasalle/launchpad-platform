name: Deploy Launchpad Control Plane

on:
  push:
    branches: [main]
    paths:
      - 'apps/controller/**'
      - 'apps/dashboard/**'
      - 'packages/**'
      - 'workflows/**'
      - 'migrations/d1/**'
      - 'package.json'
      - 'yarn.lock'
      - '.node-version'
      - '.yarnrc.yml'
      - 'tsconfig*.json'
      - 'wrangler.jsonc'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/rulesets/**'
      - '.github/workflows/deploy-control-plane.yml'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Deploy the control plane while automatic apply and reconciliation remain disabled
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  control-plane-mode:
    name: control plane / mode
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      enabled: ${{ steps.mode.outputs.enabled }}
    steps:
      - name: Resolve control-plane mode
        id: mode
        shell: bash
        env:
          ENABLED: ${{ vars.LAUNCHPAD_CONTROL_PLANE_ENABLED }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          case "$ENABLED" in
            true)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Launchpad control plane is enabled."
              ;;
            false|'')
              if [[ "$BOOTSTRAP" == "true" ]]; then
                echo "enabled=true" >> "$GITHUB_OUTPUT"
                echo "::notice::Explicit manual bootstrap accepted; automatic apply and reconciliation remain disabled."
              else
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Launchpad control plane is disabled. Follow docs/guides/deployment.md, then dispatch this workflow with bootstrap=true."
              fi
              ;;
            *)
              echo "::error::LP-CONTROL-PLANE-MODE-INVALID: LAUNCHPAD_CONTROL_PLANE_ENABLED must be exactly true or false."
              exit 1
              ;;
          esac

  verify-static-foundation:
    needs: control-plane-mode
    if: needs.control-plane-mode.outputs.enabled == 'true'
    name: static / foundation gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-launchpad
      - name: Verify toolchain decision record
        run: node scripts/check-toolchain.mjs
      - name: Verify action pins and workflow permissions
        run: node scripts/check-workflows.mjs
      - name: Verify active main ruleset
        run: node scripts/verify-ruleset.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.LAUNCHPAD_RULESET_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  deploy:
    needs: verify-static-foundation
    runs-on: ubuntu-latest
    environment: launchpad-control-plane
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - name: Verify protected-commit provenance
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "LP-UNPROTECTED-COMMIT: $GITHUB_SHA is not an ancestor of protected main"; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-launchpad
      - run: yarn typecheck && yarn test && yarn build
      - name: Render production Wrangler config from environment variables
        run: node scripts/render-wrangler-config.mjs --env production --output wrangler.deploy.json
        env:
          LAUNCHPAD_D1_DATABASE_ID: ${{ vars.LAUNCHPAD_D1_DATABASE_ID }}
          LAUNCHPAD_SECRETS_STORE_ID: ${{ vars.LAUNCHPAD_SECRETS_STORE_ID }}
          LAUNCHPAD_VERCEL_TEAM_ID: ${{ vars.LAUNCHPAD_VERCEL_TEAM_ID }}
          LAUNCHPAD_AUTHORITATIVE_DNS_RESOLVER_URL: ${{ vars.LAUNCHPAD_AUTHORITATIVE_DNS_RESOLVER_URL }}
          LAUNCHPAD_CONTROLLER_URL: ${{ vars.LAUNCHPAD_CONTROLLER_URL }}
          LAUNCHPAD_OIDC_AUDIENCE: ${{ vars.LAUNCHPAD_OIDC_AUDIENCE }}
          LAUNCHPAD_OIDC_REPOSITORY_ALLOWLIST: ${{ vars.LAUNCHPAD_OIDC_REPOSITORY_ALLOWLIST }}
          LAUNCHPAD_OIDC_WORKFLOW_ALLOWLIST: ${{ vars.LAUNCHPAD_OIDC_WORKFLOW_ALLOWLIST }}
          LAUNCHPAD_CONTROL_PLANE_ENABLED: ${{ vars.LAUNCHPAD_CONTROL_PLANE_ENABLED }}
      - name: Wrangler dry-run binding assertions
        run: |
          set -euo pipefail
          yarn wrangler deploy --env production --config wrangler.deploy.json --dry-run --outdir "$RUNNER_TEMP/launchpad-dry-run" > "$RUNNER_TEMP/launchpad-dry-run.log" 2>&1
          cat "$RUNNER_TEMP/launchpad-dry-run.log"
          for binding in ASSETS DB APPLY_WORKFLOW PREVIEW_WORKFLOW APP_PREVIEW_STATUS_WORKFLOW RECONCILE_WORKFLOW DECOMMISSION_WORKFLOW PROVIDER_EVENTS HEALTH_CHECKS SECRETS_OPERATOR_TOKEN; do
            grep -q "env.${binding} " "$RUNNER_TEMP/launchpad-dry-run.log" || { echo "Missing production binding: ${binding}"; exit 1; }
          done
          node scripts/assert-deploy-bindings.mjs --env production --config wrangler.deploy.json --concrete
          node scripts/assert-deploy-bindings.mjs --env test
      - name: Generate controller SBOM
        run: node scripts/generate-sbom.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: launchpad-sbom, path: artifacts/launchpad-sbom.cdx.json }
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: artifacts/launchpad-sbom.cdx.json
      - name: Apply production D1 migrations
        run: yarn wrangler d1 migrations apply DB --env production --config wrangler.deploy.json --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: yarn wrangler deploy --env production --config wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: yarn platform controller-smoke --controller '${{ vars.LAUNCHPAD_CONTROLLER_SMOKE_URL }}'
