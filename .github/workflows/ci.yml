name: Launchpad CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: launchpad-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: static / scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          code=false
          docs=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            code=true
            docs=true
          else
            changed_files="$(mktemp)"
            if ! git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_files"; then
              echo "::error::Unable to determine the change scope."
              exit 1
            fi
            while IFS= read -r -d '' file; do
              case "$file" in
                docs/adr/0007-toolchain-node-yarn.md) code=true; docs=true ;;
                docs/*|README.md|AGENTS.md|CONTRIBUTING.md) docs=true ;;
                *) code=true ;;
              esac
            done < "$changed_files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  toolchain:
    name: static / toolchain
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail when change classification failed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Static change classification did not complete successfully."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-launchpad
        if: needs.changes.outputs.code == 'true'
      - name: Verify toolchain decision record
        if: needs.changes.outputs.code == 'true'
        run: node scripts/check-toolchain.mjs
      - name: Verify action pins and workflow permissions
        if: needs.changes.outputs.code == 'true'
        run: node scripts/check-workflows.mjs
      - name: Verify lockfile is deduplicated
        if: needs.changes.outputs.code == 'true'
        run: yarn dedupe --check

  quality:
    name: static / quality
    needs: [changes, toolchain]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail when a static prerequisite failed
        if: needs.changes.result != 'success' || needs.toolchain.result != 'success'
        run: |
          echo "::error::A required static prerequisite did not complete successfully."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-launchpad
        if: needs.changes.outputs.code == 'true'
      - run: yarn typecheck
        if: needs.changes.outputs.code == 'true'
      - run: yarn lint
        if: needs.changes.outputs.code == 'true'
      - name: Verify documentation
        if: needs.changes.outputs.docs == 'true'
        run: node scripts/check-docs.mjs
      - run: yarn test
        if: needs.changes.outputs.code == 'true'
      - run: yarn build
        if: needs.changes.outputs.code == 'true'

  acceptance:
    name: acceptance / offline
    needs: [changes, toolchain, quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail when a quality prerequisite failed
        if: needs.changes.result != 'success' || needs.toolchain.result != 'success' || needs.quality.result != 'success'
        run: |
          echo "::error::A required acceptance prerequisite did not complete successfully."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-launchpad
        if: needs.changes.outputs.code == 'true'
      - name: Run offline acceptance gate
        if: needs.changes.outputs.code == 'true'
        run: yarn acceptance:offline
      - name: Upload acceptance evidence
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: acceptance-report
          path: artifacts/acceptance-report.json
          if-no-files-found: error
