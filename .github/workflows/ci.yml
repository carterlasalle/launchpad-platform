name: Launchpad CI

on:
  pull_request: {}

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/dependabot-plan-trust' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/dependabot-plan-trust
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Patch workflow trust gate and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/validate-plan.yml')
          text = workflow_path.read_text()
          old_condition = "needs.changes.outputs.relevant == 'true' && !github.event.pull_request.head.repo.fork"
          new_condition = "needs.changes.outputs.relevant == 'true' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]'"
          count = text.count(old_condition)
          if count != 7:
              raise SystemExit(f'expected 7 privileged conditions, found {count}')
          text = text.replace(old_condition, new_condition)

          old_block = '''          elif [[ "$relevant" == "true" ]]; then
            for entry in \\
              "schema=${{ needs.schema.result }}" \\
              "catalog=${{ needs.catalog.result }}" \\
              "provider-preflight=${{ needs.provider-preflight.result }}" \\
              "plan=${{ needs.plan.result }}" \\
              "preview=${{ needs.preview.result }}" \\
              "health=${{ needs.health.result }}"; do
              name="${entry%%=*}"
              result="${entry#*=}"
              if [[ "$result" != "success" ]]; then
                echo "::error::Required job '${name}' ended with '${result}'; the Launchpad PR gate is red."
                failed=1
              fi
            done
'''
          new_block = '''          elif [[ "$relevant" == "true" ]]; then
            entries=(
              "schema=${{ needs.schema.result }}"
              "catalog=${{ needs.catalog.result }}"
            )
            if [[ '${{ github.event.pull_request.head.repo.fork }}' != 'true' && '${{ github.actor }}' != 'dependabot[bot]' ]]; then
              entries+=(
                "provider-preflight=${{ needs.provider-preflight.result }}"
                "plan=${{ needs.plan.result }}"
                "preview=${{ needs.preview.result }}"
                "health=${{ needs.health.result }}"
              )
            else
              echo "::notice::Privileged provider jobs were intentionally skipped for a fork or Dependabot pull request."
            fi
            for entry in "${entries[@]}"; do
              name="${entry%%=*}"
              result="${entry#*=}"
              if [[ "$result" != "success" ]]; then
                echo "::error::Required job '${name}' ended with '${result}'; the Launchpad PR gate is red."
                failed=1
              fi
            done
'''
          if old_block not in text:
              raise SystemExit('aggregate block did not match expected source')
          workflow_path.write_text(text.replace(old_block, new_block))

          test_path = Path('tests/security/workflow-security.test.ts')
          tests = test_path.read_text()
          anchor = "  expect(workflow.jobs.summary?.if).toBe('${{ always() }}');\n"
          addition = '''  for (const job of ['provider-preflight', 'plan', 'preview', 'health']) {\n    expect(workflow.jobs[job]?.if, job).toContain("github.actor != 'dependabot[bot]'");\n  }\n'''
          if anchor not in tests:
              raise SystemExit('summary test anchor not found')
          tests = tests.replace(anchor, anchor + addition, 1)

          report_anchor = "  expect(report?.if).toContain(\"needs.changes.outputs.relevant == 'true'\");\n"
          report_addition = "  expect(report?.if).toContain(\"github.actor != 'dependabot[bot]'\");\n"
          if report_anchor not in tests:
              raise SystemExit('report test anchor not found')
          tests = tests.replace(report_anchor, report_anchor + report_addition, 1)

          aggregate_anchor = "  expect(aggregate?.run).toContain('Change classification ended with');\n"
          aggregate_addition = "  expect(aggregate?.run).toContain(\"github.actor }}' != 'dependabot[bot]'\");\n  expect(aggregate?.run).toContain('Privileged provider jobs were intentionally skipped');\n"
          if aggregate_anchor not in tests:
              raise SystemExit('aggregate test anchor not found')
          tests = tests.replace(aggregate_anchor, aggregate_anchor + aggregate_addition, 1)
          test_path.write_text(tests)
          PY
          corepack enable
          yarn install --immutable
          yarn test tests/security/workflow-security.test.ts
      - name: Commit permanent fix and restore normal CI workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/patch-dependabot-plan.yml
          git add .github/workflows/ci.yml .github/workflows/validate-plan.yml tests/security/workflow-security.test.ts
          git commit -m "fix(ci): gate privileged plan jobs for Dependabot"
          git pull --rebase origin fix/dependabot-plan-trust
          git push origin HEAD:fix/dependabot-plan-trust
